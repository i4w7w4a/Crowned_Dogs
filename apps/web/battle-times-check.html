<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка времени суток — Crowned Dogs</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101315;color:#e8ecee;font:15px/1.5 system-ui,sans-serif}.layout{display:flex;justify-content:center;align-items:flex-start;gap:24px;padding:16px}.frame{height:calc(100dvh - 32px);aspect-ratio:941/1672;position:relative;flex-shrink:0;background:#080a0c;overflow:hidden;border-radius:14px}.frame img,.frame canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}aside{width:min(470px,46vw);padding:8px 0}h1{font-size:21px;margin:0 0 16px}fieldset{margin:0 0 15px;padding:12px;border:1px solid #424b50;border-radius:12px}legend{color:#b5c0c5}label{display:inline-flex;gap:7px;align-items:center;margin:6px 12px 6px 0}select,button{font:inherit;background:#20272b;color:#e8ecee;border:1px solid #56636a;border-radius:9px;padding:8px 11px}select{width:100%}button{cursor:pointer;margin:0 7px 10px 0}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b9c8ce;background:#151a1d;padding:12px;border-radius:10px}#errors{color:#f7a99c}#status{color:#b1c7d0;min-height:26px}.note{color:#9eafb6;font-size:13px}@media(max-width:680px){.layout{display:block;padding:10px}.frame{height:65dvh;margin:auto}aside{width:auto;max-width:520px;margin:16px auto}}
</style>
<div class="layout" id="qa" data-ready="false" data-error-count="0">
  <div class="frame" id="viewport"><img id="plate" alt="Соляной цех" draggable="false"><canvas id="gl" aria-label="Проверка карты и Персон"></canvas></div>
  <aside>
    <h1>Время суток · проверка GPU</h1>
    <p id="status" role="status">Загружаю сцену…</p>
    <fieldset><legend>Время</legend>
      <label><input type="radio" name="time" value="morning">Утро</label>
      <label><input type="radio" name="time" value="day" checked>День</label>
      <label><input type="radio" name="time" value="evening">Вечер</label>
      <label><input type="radio" name="time" value="night">Ночь</label>
    </fieldset>
    <fieldset><legend>Реальный комплект</legend><select id="kit" aria-label="Комплект">
      <option value="plain">Обычный комплект</option>
      <option value="nvg">ПНВ «Сыч»</option>
      <option value="suppressed">Глушитель «Тишина»</option>
      <option value="nvg-suppressed">ПНВ и глушитель</option>
    </select></fieldset>
    <fieldset><legend>Графика и камера</legend>
      <select id="quality" aria-label="Графика"><option value="low">Низкая</option><option value="medium">Средняя</option><option value="high" selected>Высокая</option><option value="ultra">Ультра</option></select>
      <label><input id="fp" type="checkbox" checked>От первого лица</label>
    </fieldset>
    <button type="button" id="shot" disabled>Выстрел</button><button type="button" id="step" disabled>Вперёд на 2 шага</button><button type="button" id="reset" disabled>Новый бой</button>
    <p class="note">Тест всегда без звука. Это отдельная служебная страница. ПНВ и глушитель берутся из каталога игры; правила рассчитывает обычное ядро.</p>
    <pre id="report">Ожидание…</pre><pre id="errors" hidden></pre>
  </aside>
</div>
<script>window.addEventListener('error',function(e){var q=document.getElementById('qa'),p=document.getElementById('errors'),count=Number(q.dataset.errorCount||0);p.hidden=false;if(count<3)p.textContent+=(e.error&&e.error.stack||e.message||'Ошибка загрузки')+'\n';q.dataset.errorCount=String(count+1)})</script>
<script type="module" src="/src/arena/battle-times-check.ts"></script>
</html>
