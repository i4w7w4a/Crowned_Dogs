[package]
name = "game-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "NodeList", "Event", "EventTarget", "HtmlElement", "HtmlButtonElement", "HtmlInputElement", "HtmlCanvasElement", "HtmlImageElement", "HtmlDialogElement", "CssStyleDeclaration", "DomTokenList", "DomRect", "KeyboardEvent", "MouseEvent", "PointerEvent", "WheelEvent", "Storage", "Performance", "MediaQueryList", "AddEventListenerOptions", "AbortController", "AbortSignal", "DomException", "console"] }
serde_json.workspace = true
game-core = { path = "../game-core" }
game-client = { path = "../game-client" }
game-graphics = { path = "../game-graphics" }
game-motion = { path = "../game-motion" }
game-ui = { path = "../game-ui" }
